name: sbom
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generate_sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t devsecops-ci-pipeline:local .
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: devsecops-ci-pipeline:local
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
